[project]
name = "clinical-rag"
version = "0.1.0"
description = "Clinical Q&A system with citation-grounded RAG over synthetic FHIR data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Config / models
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Datastore: Postgres + pgvector
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Provider-agnostic LLM clients (one OpenAI-compatible, one Anthropic-compatible)
    "openai>=1.54",
    "anthropic>=0.39",
    # Local, offline embeddings (default). Switchable to a remote provider via env.
    "fastembed>=0.4",
    # Orchestration helpers
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "httpx>=0.27",
    # PHI detection & redaction (Phase 3): Presidio (NER + rules) over spaCy.
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7,<3.9",
    # spaCy English model, pinned as a direct URL so `uv sync` is self-contained
    # (no separate `spacy download` step). The large model is Presidio's
    # recommended default: its NER is precise enough not to redact clinical terms
    # (the small model misclassifies words like "Gender" as PERSON).
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
